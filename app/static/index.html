<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Soil Analytics — Nutrient Assessment & Intelligent Crop Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F6F0;
  --card-bg: #FFFFFF;
  --primary: #1B4332;
  --primary-light: #2D6A4F;
  --secondary: #40916C;
  --accent: #74C69D;
  --earth: #7F5539;
  --earth-light: #E6CCB2;
  --text-main: #1F2421;
  --text-muted: #5C675E;
  --border: #E2DDD5;
  --status-green: #2D6A4F;
  --status-green-bg: #D8F3DC;
  --status-yellow: #B5830B;
  --status-yellow-bg: #FEF3C7;
  --status-red: #B91C1C;
  --status-red-bg: #FEE2E2;
  --shadow: 0 4px 20px rgba(27, 67, 50, 0.06);
  --shadow-lg: 0 10px 30px rgba(27, 67, 50, 0.12);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* App Layout */
.app-container {
  display: flex;
  min-height: 100vh;
}

/* Sidebar Navigation */
.sidebar {
  width: 260px;
  background: var(--primary);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 100;
  transition: transform 0.3s ease;
}

.brand-header {
  padding: 24px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.brand-icon {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  flex-shrink: 0;
}

.brand-title {
  font-size: 17px;
  font-weight: 700;
  color: #FFFFFF;
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.brand-sub {
  font-size: 11px;
  color: var(--accent);
  font-weight: 500;
}

.nav-menu {
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-grow: 1;
  overflow-y: auto;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  color: #D8E2DC;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s ease;
  min-height: 44px;
}

.nav-link:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #FFFFFF;
}

.nav-link.active {
  background: var(--primary-light);
  color: #FFFFFF;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.nav-icon {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  fill: currentColor;
}

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 12px;
  color: rgba(255, 255, 255, 0.6);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.sidebar-footer a {
  color: var(--accent);
  text-decoration: none;
}

/* Main Content Area */
.main-wrapper {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Top App Bar */
.top-bar {
  background: var(--card-bg);
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 90;
}

.top-bar-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.page-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.3px;
}

.top-bar-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.field-selector {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--bg);
  color: var(--text-main);
  min-width: 170px;
  font-weight: 500;
  cursor: pointer;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  text-decoration: none;
  min-height: 44px;
  transition: all 0.2s ease;
}

.btn-primary {
  background: var(--primary);
  color: #FFFFFF;
}

.btn-primary:hover {
  background: var(--primary-light);
}

.btn-secondary {
  background: var(--secondary);
  color: #FFFFFF;
}

.btn-secondary:hover {
  background: var(--primary-light);
}

.btn-outline {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text-main);
}

.btn-outline:hover {
  background: rgba(0, 0, 0, 0.04);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 13px;
  min-height: 36px;
}

/* Language Selector */
.lang-select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  background: var(--card-bg);
  color: var(--primary);
  cursor: pointer;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
}

.status-pill.online {
  background: var(--status-green-bg);
  color: var(--status-green);
}

.status-pill.offline {
  background: var(--status-red-bg);
  color: var(--status-red);
}

/* Page Content View */
.content-area {
  padding: 28px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

/* Card Components */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 24px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.card-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* KPI Grid */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-left: 4px solid var(--secondary);
}

.kpi-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--status-green-bg);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}

.kpi-value {
  font-size: 26px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.2;
}

.kpi-label {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}

/* 2-Column Responsive Grid */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

/* Module 1: Image Input Cards */
.upload-dropzone {
  border: 2px dashed var(--secondary);
  border-radius: 12px;
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  background: #FAFCF9;
  transition: all 0.2s ease;
  display: block;
}

.upload-dropzone:hover {
  background: #F0F7F2;
  border-color: var(--primary);
}

.upload-dropzone input[type="file"] {
  display: none;
}

.dropzone-icon {
  font-size: 40px;
  color: var(--secondary);
  margin-bottom: 12px;
}

.dropzone-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 4px;
}

.dropzone-hint {
  font-size: 12px;
  color: var(--text-muted);
}

/* Live Camera Card */
.camera-container {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}

.camera-container video, .camera-container canvas, .camera-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.camera-placeholder {
  color: #AAA;
  text-align: center;
  padding: 20px;
}

.camera-placeholder-icon {
  font-size: 44px;
  margin-bottom: 8px;
}

.camera-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* Preview & Comparison */
.preview-box {
  margin-top: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  background: var(--bg);
}

.comparison-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 12px;
}

.comparison-item {
  text-align: center;
}

.comparison-item img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #000;
}

.comparison-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-top: 6px;
}

/* Soil Test Form */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 6px;
}

.form-input {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: #FFFFFF;
  color: var(--text-main);
  outline: none;
  transition: border-color 0.2s;
  min-height: 44px;
}

.form-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
}

.form-hint {
  font-size: 11px;
  color: var(--text-muted);
}

/* Health Results Badges */
.status-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
}

.status-badge.green { background: var(--status-green-bg); color: var(--status-green); }
.status-badge.yellow { background: var(--status-yellow-bg); color: var(--status-yellow); }
.status-badge.red { background: var(--status-red-bg); color: var(--status-red); }

/* Soil Health Score Wheel */
.score-card {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px;
  background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
  border-radius: 12px;
  margin-bottom: 20px;
  border: 1px solid #A5D6A7;
}

.score-circle {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: var(--primary);
  color: #FFF;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(27,67,50,0.25);
}

.score-num {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
}

.score-denom {
  font-size: 10px;
  opacity: 0.8;
}

.advisory-box {
  background: #FFFDF9;
  border: 1px solid var(--earth-light);
  border-left: 5px solid var(--earth);
  border-radius: 10px;
  padding: 16px;
  margin-top: 14px;
}

.advisory-box h4 {
  font-size: 15px;
  color: var(--earth);
  margin-bottom: 8px;
}

.advisory-list {
  padding-left: 20px;
  font-size: 13px;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* Crop Recommendations Grid */
.crop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-top: 16px;
}

.crop-card {
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease;
}

.crop-card:hover {
  transform: translateY(-2px);
  border-color: var(--secondary);
}

.crop-icon {
  font-size: 34px;
  margin-bottom: 8px;
}

.crop-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
}

.crop-badge {
  display: inline-block;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--status-green-bg);
  color: var(--status-green);
}

/* Tables */
.table-responsive {
  overflow-x: auto;
  border-radius: 8px;
  border: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 14px;
}

th, td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

th {
  background: #F4F1EA;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: #FAF8F5; }

/* Toast Notifications */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 14px 20px;
  background: var(--text-main);
  color: #FFFFFF;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  display: none;
  z-index: 1000;
  max-width: 400px;
}

#toast.show { display: block; animation: slideUp 0.3s ease; }
#toast.success { background: var(--status-green); }
#toast.error { background: var(--status-red); }

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Modal Dialog */
dialog {
  border: none;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 26px;
  max-width: 460px;
  width: 90%;
  margin: auto;
}

dialog::backdrop {
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(2px);
}

/* Mobile Bottom Navigation */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--primary);
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  z-index: 100;
  padding: 4px 6px;
}

.mobile-nav-items {
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.mobile-nav-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: #D8E2DC;
  text-decoration: none;
  font-size: 10px;
  font-weight: 500;
  padding: 6px 4px;
  min-height: 48px;
  flex: 1;
}

.mobile-nav-link.active {
  color: #FFFFFF;
  font-weight: 700;
}

.mobile-nav-icon {
  font-size: 18px;
}

/* Print Styles for Reports */
@media print {
  body { background: #FFF !important; color: #000 !important; }
  .sidebar, .top-bar, .mobile-nav, .btn, .card-header .btn, #toast, dialog { display: none !important; }
  .main-wrapper { margin: 0 !important; width: 100% !important; }
  .content-area { padding: 0 !important; max-width: 100% !important; }
  .card { box-shadow: none !important; border: 1px solid #CCC !important; page-break-inside: avoid; }
  .print-only { display: block !important; }
}

.print-only { display: none; }

/* Responsive Breakpoints */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .mobile-nav { display: block; }
  .main-wrapper { margin-bottom: 60px; }
  .grid-2 { grid-template-columns: 1fr; }
  .content-area { padding: 18px 14px; }
  .top-bar { padding: 12px 16px; }
}

/* Mobile layout fixes */
@media (max-width: 900px) {
  .top-bar {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 12px 14px;
  }

  .top-bar-left {
    min-width: 0;
  }

  .page-title {
    font-size: clamp(18px, 5vw, 22px);
  }

  .top-bar-right {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    width: 100%;
    gap: 8px;
  }

  #farmSelect {
    grid-column: 1 / -1;
    width: 100%;
    min-width: 0;
  }

  #btnOpenNewFarm {
    grid-column: 1;
    width: 100%;
    white-space: nowrap;
  }

  #langSelect {
    grid-column: 2;
    width: 100%;
    min-width: 0;
  }

  #systemStatus {
    grid-column: 1 / -1;
    justify-self: start;
  }

  .grid-2 > *,
  .card {
    min-width: 0;
  }

  .card-header {
    flex-wrap: wrap;
    gap: 8px;
  }

  .card-header .btn {
    flex-shrink: 0;
  }

  .table-responsive {
    display: block;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .table-responsive table {
    min-width: 620px;
    width: 100%;
  }

  .mobile-nav {
    display: block;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 1000;
    padding: 4px 6px env(safe-area-inset-bottom);
  }

  .mobile-nav-items {
    width: 100%;
    min-height: 56px;
  }

  .mobile-nav-link {
    min-width: 0;
    flex: 1;
    font-size: 10px;
  }

  .content-area {
    padding-bottom: calc(85px + env(safe-area-inset-bottom));
  }
}

@media (max-width: 480px) {
  .content-area {
    padding-left: 10px;
    padding-right: 10px;
  }

  .top-bar {
    padding-left: 10px;
    padding-right: 10px;
  }
}

</style>
</head>
<body>

<div class="app-container">
  <!-- Desktop Sidebar Navigation -->
  <aside class="sidebar">
    <div class="brand-header">
      <div class="brand-icon">🌱</div>
      <div>
        <div class="brand-title" data-i18n="app_title">Soil Analytics</div>
        <div class="brand-sub" data-i18n="app_subtitle">Smart Crop Advisory</div>
      </div>
    </div>

    <nav class="nav-menu">
      <a href="#home" class="nav-link active" data-nav="home">
        <span class="nav-icon">🏠</span>
        <span data-i18n="nav_home">Home</span>
      </a>
      <a href="#analyze" class="nav-link" data-nav="analyze">
        <span class="nav-icon">🔬</span>
        <span data-i18n="nav_analyze">Analyze Soil</span>
      </a>
      <a href="#farms" class="nav-link" data-nav="farms">
        <span class="nav-icon">🌾</span>
        <span data-i18n="nav_farms">My Farms</span>
      </a>
      <a href="#history" class="nav-link" data-nav="history">
        <span class="nav-icon">📜</span>
        <span data-i18n="nav_history">Soil History</span>
      </a>
      <a href="#advisory" class="nav-link" data-nav="advisory">
        <span class="nav-icon">💡</span>
        <span data-i18n="nav_advisory">Crop Advisory</span>
      </a>
      <a href="#reports" class="nav-link" data-nav="reports">
        <span class="nav-icon">📊</span>
        <span data-i18n="nav_reports">Reports</span>
      </a>
      <a href="#help" class="nav-link" data-nav="help">
        <span class="nav-icon">❓</span>
        <span data-i18n="nav_help">Help</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span>v1.0 • PostgreSQL</span>
      <a href="/docs" target="_blank">API Docs</a>
    </div>
  </aside>

  <!-- Main View -->
  <div class="main-wrapper">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="top-bar-left">
        <h1 class="page-title" id="pageTitle" data-i18n="nav_home">Dashboard</h1>
      </div>

      <div class="top-bar-right">

let currentLang = 'en';

function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key]) || (I18N['en'] && I18N['en'][key]) || key;
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    el.textContent = t(k);
  });
}

// ============================================================================
// APPLICATION STATE & API CLIENT
// ============================================================================
let state = {
  fields: [],
  activeFieldId: null,
  activeRoute: 'home',
  datasetStatus: null,
  latestSoilTest: null,
  latestImage: null,
  cameraStream: null,
  capturedBase64: null,
};

async function fetchApi(url, options = {}) {
  try {
    const res = await fetch(url, options);
    if (!res.ok) {
      let errText = res.statusText;
      try {
        const errJson = await res.json();
        errText = errJson.detail || errJson.message || JSON.stringify(errJson);
      } catch (_) {}
      throw new Error(errText);
    }
    if (res.status === 204) return null;
    return await res.json();
  } catch (err) {
    console.error(`API Error on ${url}:`, err);
    throw err;
  }
}

function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `show ${type}`;
  setTimeout(() => { toast.className = ''; }, 4500);
}

// ============================================================================
// INITIALIZATION & ROUTING
// ============================================================================
async function initApp() {
  setupNavigation();
  setupLanguageSwitcher();
  setupNewFarmDialog();

  await checkHealth();
  await loadDatasetStatus();
  await refreshFields();

  window.addEventListener('hashchange', handleRoute);
  handleRoute();
}

async function checkHealth() {
  try {
    const h = await fetchApi('/health');
    const pill = document.getElementById('systemStatus');
    if (h.status === 'ok') {
      pill.textContent = '● ' + (h.db === 'connected' ? 'PostgreSQL Active' : 'API Active');
      pill.className = 'status-pill online';
    } else {
      pill.textContent = '● Degraded';
      pill.className = 'status-pill offline';
    }
  } catch (e) {
    const pill = document.getElementById('systemStatus');
    pill.textContent = '● Server Offline';
    pill.className = 'status-pill offline';
  }
}

async function loadDatasetStatus() {
  try {
    state.datasetStatus = await fetchApi('/api/dataset/status');
  } catch (e) {
    console.warn('Dataset status API not ready yet:', e);
  }
}

async function refreshFields() {
  try {
    state.fields = await fetchApi('/api/fields');
    const select = document.getElementById('farmSelect');
    select.innerHTML = '';

    if (state.fields.length === 0) {
      select.innerHTML = '<option value="">-- No Farms Registered --</option>';
      state.activeFieldId = null;
    } else {
      state.fields.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = `${f.name} ${f.location ? '(' + f.location + ')' : ''}`;
        select.appendChild(opt);
      });
      if (!state.activeFieldId || !state.fields.some(f => f.id === state.activeFieldId)) {
        state.activeFieldId = state.fields[0].id;
      }
      select.value = state.activeFieldId;
    }
  } catch (err) {
    showToast('Failed to load farm fields: ' + err.message, 'error');
  }
}

function setupNavigation() {
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', (e) => {
      const target = el.getAttribute('data-nav');
      window.location.hash = target;
    });
  });

  document.getElementById('farmSelect').addEventListener('change', (e) => {
    state.activeFieldId = parseInt(e.target.value) || null;
    renderCurrentRoute();
  });
}

function setupLanguageSwitcher() {
  const sel = document.getElementById('langSelect');
  sel.addEventListener('change', (e) => {
    currentLang = e.target.value;
    applyTranslations();
    renderCurrentRoute();
  });
}

function setupNewFarmDialog() {
  const dlg = document.getElementById('newFarmDialog');
  document.getElementById('btnOpenNewFarm').onclick = () => dlg.showModal();
  document.getElementById('btnCloseFarmModal').onclick = () => dlg.close();

  document.getElementById('newFarmForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = {
      name: fd.get('name'),
      farmer_name: fd.get('farmer_name') || null,
      location: fd.get('location') || null,
    };
    try {
      const created = await fetchApi('/api/fields', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      showToast('Farm registered successfully!', 'success');
      dlg.close();
      e.target.reset();
      await refreshFields();
      state.activeFieldId = created.id;
      document.getElementById('farmSelect').value = created.id;
      renderCurrentRoute();
    } catch (err) {
      showToast('Error registering farm: ' + err.message, 'error');
    }
  };
}

function handleRoute() {
  const hash = window.location.hash.replace('#', '') || 'home';
  state.activeRoute = hash;

  // Update active state in navbars
  document.querySelectorAll('[data-nav]').forEach(el => {
    if (el.getAttribute('data-nav') === hash) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });

  const titles = {
    home: t('nav_home'),
    analyze: t('nav_analyze'),
    farms: t('nav_farms'),
    history: t('nav_history'),
    advisory: t('nav_advisory'),
    reports: t('nav_reports'),
    help: t('nav_help'),
  };
  document.getElementById('pageTitle').textContent = titles[hash] || 'Soil Analytics';

  renderCurrentRoute();
}

function renderCurrentRoute() {
  stopCamera(); // Clean up camera stream whenever switching tabs
  const container = document.getElementById('mainContent');
  switch (state.activeRoute) {
    case 'home':
      renderHome(container);
      break;
    case 'analyze':
      renderAnalyze(container);
      break;
    case 'farms':
      renderFarms(container);
      break;
    case 'history':
      renderHistory(container);
      break;
    case 'advisory':
      renderAdvisory(container);
      break;
    case 'reports':
      renderReports(container);
      break;
    case 'help':
      renderHelp(container);
      break;
    default:
      renderHome(container);
  }
  applyTranslations();
}

function bindAnalyzeEvents() {
  // --- Gallery File Upload Handler ---
  const fileInput = document.getElementById('fileInput');
  const uploadPreviewBox = document.getElementById('uploadPreviewBox');
  const uploadPreviewImg = document.getElementById('uploadPreviewImg');
  const uploadFileName = document.getElementById('uploadFileName');
  let selectedFile = null;

  fileInput.onchange = (e) => {
    if (e.target.files && e.target.files[0]) {
      selectedFile = e.target.files[0];
      uploadFileName.textContent = `${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
      const reader = new FileReader();
      reader.onload = (re) => {
        uploadPreviewImg.src = re.target.result;
        uploadPreviewBox.style.display = 'block';
      };
      reader.readAsDataURL(selectedFile);
    }
  };

  document.getElementById('btnRemoveUpload').onclick = () => {
    selectedFile = null;
    fileInput.value = '';
    uploadPreviewBox.style.display = 'none';
  };

  document.getElementById('btnSubmitUpload').onclick = async () => {
    if (!selectedFile || !state.activeFieldId) return;
    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      showToast('Uploading and running OpenCV preprocessing...', 'info');
      const res = await fetchApi(`/api/fields/${state.activeFieldId}/images`, {
        method: 'POST',
        body: formData,
      });
      showToast('Image uploaded and preprocessed successfully!', 'success');
      showPreprocessResult(res.image.id, res.warnings);
    } catch (err) {
      showToast('Upload error: ' + err.message, 'error');
    }
  };

  // --- Live Camera Stream Handler (Module 1, 8) ---
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  const snapImg = document.getElementById('cameraSnapshot');
  const placeholder = document.getElementById('cameraPlaceholder');
  const btnStart = document.getElementById('btnStartCamera');
  const btnSnap = document.getElementById('btnSnapPhoto');
  const btnRetake = document.getElementById('btnRetakePhoto');
  const btnUse = document.getElementById('btnUseCameraPhoto');

  btnStart.onclick = async () => {
    try {
      // Support environment camera mode on mobile
      const constraints = {
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 },
        }
      };
      state.cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = state.cameraStream;
      video.style.display = 'block';
      placeholder.style.display = 'none';
      snapImg.style.display = 'none';
      btnStart.style.display = 'none';
      btnSnap.style.display = 'inline-flex';
      btnRetake.style.display = 'none';
      btnUse.style.display = 'none';
    } catch (err) {
      showToast('Camera access failed: ' + (err.name === 'NotAllowedError' ? 'Permission Denied. Please enable camera in browser settings.' : err.message), 'error');
    }
  };

  btnSnap.onclick = () => {
    if (!video.videoWidth) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    state.capturedBase64 = canvas.toDataURL('image/jpeg', 0.92);

    snapImg.src = state.capturedBase64;
    snapImg.style.display = 'block';
    video.style.display = 'none';

    btnSnap.style.display = 'none';
    btnRetake.style.display = 'inline-flex';
    btnUse.style.display = 'inline-flex';
  };

  btnRetake.onclick = () => {
    state.capturedBase64 = null;
    snapImg.style.display = 'none';
    video.style.display = 'block';
    btnSnap.style.display = 'inline-flex';
    btnRetake.style.display = 'none';
    btnUse.style.display = 'none';
  };

  btnUse.onclick = async () => {
    if (!state.capturedBase64 || !state.activeFieldId) return;
    try {
      showToast('Sending live photo to backend...', 'info');
      const res = await fetchApi('/api/images/upload-base64', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          field_id: state.activeFieldId,
          image_data: state.capturedBase64,
        }),
      });
      showToast('Camera photo preprocessed successfully!', 'success');
      stopCamera();
      btnStart.style.display = 'inline-flex';
      btnRetake.style.display = 'none';
      btnUse.style.display = 'none';
      placeholder.style.display = 'block';
      snapImg.style.display = 'none';
      showPreprocessResult(res.image.id, res.warnings);
    } catch (err) {
      showToast('Camera upload error: ' + err.message, 'error');
    }
  };

  // --- Soil Laboratory Test Form Handler ---
  document.getElementById('soilTestForm').onsubmit = async (e) => {
    e.preventDefault();
    if (!state.activeFieldId) return;

    const fd = new FormData(e.target);
    const body = {
      nitrogen: parseFloat(fd.get('nitrogen')),
      phosphorus: parseFloat(fd.get('phosphorus')),
      potassium: parseFloat(fd.get('potassium')),
      ph: parseFloat(fd.get('ph')),
      organic_matter: parseFloat(fd.get('organic_matter')),
      moisture: parseFloat(fd.get('moisture')),
      notes: fd.get('notes') || null,
    };

    try {
      showToast('Submitting soil laboratory test...', 'info');
      const test = await fetchApi(`/api/fields/${state.activeFieldId}/soil-tests`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      // Also fetch advisory recommendations
      const adv = await fetchApi(`/api/soil-tests/${test.id}/advisory`);
      showSoilResults(test, adv);
      showToast('Soil test analyzed and advisory generated!', 'success');
    } catch (err) {
      showToast('Failed to record soil test: ' + err.message, 'error');
    }
  };
}

function stopCamera() {
  if (state.cameraStream) {
    state.cameraStream.getTracks().forEach(t => t.stop());
    state.cameraStream = null;
  }
}

function showPreprocessResult(imageId, warnings = []) {
  const card = document.getElementById('preprocessResultCard');
  if (!card) return;
  card.style.display = 'block';
  document.getElementById('cmpOriginalImg').src = `/api/images/${imageId}/file?t=${Date.now()}`;
  document.getElementById('cmpProcessedImg').src = `/api/images/${imageId}/preprocessed?t=${Date.now()}`;

  const warnDiv = document.getElementById('preprocessWarnings');
  if (warnings && warnings.length > 0) {
    warnDiv.innerHTML = warnings.map(w => `
      <div style="background: var(--status-yellow-bg); color: var(--status-yellow); padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-top: 6px;">
        ⚠️ Image Quality Notice: ${w}
      </div>
    `).join('');
  } else {
    warnDiv.innerHTML = `
      <div style="background: var(--status-green-bg); color: var(--status-green); padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600;">
        ✓ Image passes all quality checks (variance, lightness, resolution). Ready for CNN inference.
      </div>
    `;
  }
}

window.setActiveFarm = (fieldId) => {
  state.activeFieldId = fieldId;
  document.getElementById('farmSelect').value = fieldId;
  showToast('Active farm plot updated', 'success');
  renderFarms(document.getElementById('mainContent'));
};

window.deleteFarm = async (fieldId) => {
  if (!confirm('Are you sure you want to delete this farm plot? All attached tests will be removed.')) return;
  try {
    await fetchApi(`/api/fields/${fieldId}`, { method: 'DELETE' });
    showToast('Farm plot deleted', 'info');
    await refreshFields();
    renderFarms(document.getElementById('mainContent'));
  } catch (err) {
    showToast('Error deleting farm: ' + err.message, 'error');
  }
};

window.exportTestsCsv = async () => {
  if (!state.activeFieldId) return;
  try {
    const tests = await fetchApi(`/api/fields/${state.activeFieldId}/soil-tests`);
    if (tests.length === 0) {
      showToast('No tests to export', 'error');
      return;
    }
    const headers = ['id', 'tested_at', 'nitrogen', 'phosphorus', 'potassium', 'ph', 'organic_matter', 'moisture', 'health_score'];
    const rows = tests.map(t => [t.id, t.tested_at, t.nitrogen, t.phosphorus, t.potassium, t.ph, t.organic_matter, t.moisture, t.health_score || '']);
    const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');

    const blob = new Blob([csvContent], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `soil_tests_field_${state.activeFieldId}.csv`;
    a.click();
    showToast('CSV downloaded successfully!', 'success');
  } catch (err) {
    showToast('Export error: ' + err.message, 'error');
  }
};
