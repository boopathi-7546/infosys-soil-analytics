services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: soil
      POSTGRES_PASSWORD: soil
      POSTGRES_DB: soildb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soil -d soildb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://soil:soil@db:5432/soildb
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: "10"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
